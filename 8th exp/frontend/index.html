<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment 8 - Kafka Producer and Consumer</title>
<style>
  :root {
    --bg: #eef1f4; --panel: #ffffff; --ink: #14202b; --muted: #5d6b79; --line: #d5dce3;
    --prod: #0e7c86; --prod-soft: #dff1f2; --cons: #6d3fc0; --cons-soft: #ece4fa;
    --ok: #1f7a3d; --warn: #9a5b00; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161c; --panel: #18212a; --ink: #e8eef3; --muted: #93a1af; --line: #2b3844;
      --prod: #4fc3cc; --prod-soft: #12353a; --cons: #b79af0; --cons-soft: #2a2145;
      --ok: #62c283; --warn: #e0a64a; --err: #f0857d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; line-height: 1.5; }
  header { max-width: 1100px; margin: 0 auto; padding: 28px 20px 8px;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  #status { padding: 6px 12px; border-radius: 999px; font-size: .85rem; font-weight: 600;
    background: var(--panel); border: 1px solid var(--line); }
  #status.kafka { color: var(--ok); } #status.demo { color: var(--warn); } #status.off { color: var(--err); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 20px 40px;
    display: grid; grid-template-columns: 1fr 1.3fr; gap: 20px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  .producer { border-top: 5px solid var(--prod); }
  .consumer { border-top: 5px solid var(--cons); }
  h2 { margin: 0 0 14px; font-size: 1.1rem; }
  .producer h2 { color: var(--prod); } .consumer h2 { color: var(--cons); }
  label { display: block; font-size: .9rem; font-weight: 600; margin: 12px 0 4px; }
  input, textarea { width: 100%; padding: 10px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid var(--prod); outline-offset: 1px; }
  textarea { resize: vertical; min-height: 90px; }
  .hint { color: var(--muted); font-size: .82rem; margin-top: 4px; }
  button { margin-top: 16px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer;
    color: #fff; background: var(--prod); border: 0; border-radius: 6px; }
  @media (prefers-color-scheme: dark) { button { color: #08262a; } }
  button:disabled { opacity: .6; cursor: wait; }
  #sendResult { margin-top: 12px; font-size: .9rem; min-height: 1.4em; }
  #sendResult.error { color: var(--err); }
  .feed-head { display: flex; justify-content: space-between; align-items: center; }
  .feed-head button { margin: 0; padding: 4px 10px; font-size: .8rem; background: transparent;
    color: var(--muted); border: 1px solid var(--line); }
  #feed { list-style: none; margin: 0; padding: 0; max-height: 520px; overflow-y: auto; }
  #feed li { border: 1px solid var(--line); border-left: 4px solid var(--cons); background: var(--cons-soft);
    border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
  #feed .meta { font-size: .78rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  #feed .val { margin-top: 3px; word-break: break-word; }
  #empty { color: var(--muted); padding: 24px 0; }
  .p0 { border-left-color: #0e7c86 !important; } .p1 { border-left-color: #6d3fc0 !important; } .p2 { border-left-color: #c77d00 !important; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Kafka producer and consumer</h1>
    <p>Experiment 8. Send a message, then watch the consumer receive it from the topic.</p>
  </div>
  <div id="status" class="off">Checking server...</div>
</header>

<main>
  <section class="producer">
    <h2>Producer</h2>
    <label for="key">Key (optional)</label>
    <input id="key" placeholder="e.g. user-42">
    <div class="hint">Messages with the same key always go to the same partition.</div>
    <label for="msg">Message</label>
    <textarea id="msg" placeholder="Type a message to send"></textarea>
    <button id="send">Send message</button>
    <div id="sendResult" role="status"></div>
  </section>

  <section class="consumer">
    <div class="feed-head">
      <h2>Consumer</h2>
      <button id="clear" type="button">Clear list</button>
    </div>
    <ul id="feed"></ul>
    <div id="empty">No messages yet. Send one from the producer.</div>
  </section>
</main>

<script>
  // Works when opened from the backend (http://localhost:3000) or via VS Code Live Server.
  const API = location.port === '3000' ? '' : 'http://localhost:3000';
  const $ = (id) => document.getElementById(id);

  async function loadStatus() {
    try {
      const s = await (await fetch(API + '/api/status')).json();
      const el = $('status');
      if (s.mode === 'kafka') { el.className = 'kafka'; el.textContent = 'Connected to Kafka (' + s.broker + ')'; }
      else if (s.mode === 'demo') { el.className = 'demo'; el.textContent = 'Demo mode: Kafka not running, using in-memory topic'; }
      else { el.className = 'off'; el.textContent = 'Connecting to Kafka...'; setTimeout(loadStatus, 1500); }
    } catch (e) {
      $('status').className = 'off';
      $('status').textContent = 'Backend not running. Start it with npm start.';
      setTimeout(loadStatus, 3000);
    }
  }

  function addMessage(m) {
    $('empty').style.display = 'none';
    const li = document.createElement('li');
    li.className = 'p' + (m.partition % 3);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = 'Partition ' + m.partition + '  |  Offset ' + m.offset +
      '  |  Key: ' + (m.key || 'none') + '  |  ' + new Date(m.time).toLocaleTimeString();
    const val = document.createElement('div');
    val.className = 'val';
    val.textContent = m.value;
    li.append(meta, val);
    $('feed').prepend(li);
  }

  function connectStream() {
    const es = new EventSource(API + '/api/stream');
    es.onmessage = (e) => addMessage(JSON.parse(e.data));
    es.onerror = () => { /* browser retries automatically */ };
  }

  $('send').addEventListener('click', async () => {
    const message = $('msg').value.trim();
    const out = $('sendResult');
    out.className = '';
    if (!message) { out.className = 'error'; out.textContent = 'Enter a message first.'; return; }
    $('send').disabled = true;
    try {
      const res = await fetch(API + '/api/produce', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: $('key').value.trim(), message })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Send failed');
      out.textContent = 'Sent to partition ' + data.partition + ', offset ' + data.offset + '.';
      $('msg').value = '';
    } catch (err) {
      out.className = 'error';
      out.textContent = err.message === 'Failed to fetch' ? 'Cannot reach the backend. Run npm start in the backend folder.' : err.message;
    } finally { $('send').disabled = false; }
  });

  $('clear').addEventListener('click', () => { $('feed').innerHTML = ''; $('empty').style.display = ''; });

  loadStatus();
  connectStream();
</script>
</body>
</html>
