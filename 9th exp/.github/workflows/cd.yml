name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo

jobs:
  # 1. Re-use the CI pipeline: nothing is deployed unless every test passes
  ci:
    uses: ./.github/workflows/ci.yml

  # 2. Build the Docker image, smoke-test it, push to Docker Hub
  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    env:
      HAS_REGISTRY: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local, for smoke test)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ci-cd-demo:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 8080:8080 ci-cd-demo:smoke
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health | grep -q UP; then
              echo "Container is healthy"; exit 0
            fi
            sleep 3
          done
          docker logs smoke
          exit 1

      - name: Log in to Docker Hub
        if: env.HAS_REGISTRY == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: env.HAS_REGISTRY == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha

      - name: Registry not configured
        if: env.HAS_REGISTRY != 'true'
        run: echo "DOCKERHUB_* secrets not set - image built and tested but not pushed."

  # 3. Canary: send roughly 10% of traffic to the new version
  deploy-canary:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - uses: actions/checkout@v4

      - name: No cluster configured
        if: env.KUBE_CONFIG == ''
        run: |
          echo "KUBE_CONFIG secret not set - skipping real deployment."
          echo "Would deploy ${{ env.IMAGE_NAME }}:${{ github.sha }} as canary (1 of 10 pods = 10% traffic)."

      - name: Configure kubectl
        if: env.KUBE_CONFIG != ''
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBE_CONFIG" | base64 -d > $HOME/.kube/config

      - name: Deploy canary (10% of pods)
        if: env.KUBE_CONFIG != ''
        run: |
          sed -i "s|DOCKERHUB_USER|${{ secrets.DOCKERHUB_USERNAME }}|g" k8s/*.yaml
          kubectl apply -f k8s/
          kubectl set image deployment/product-service-canary app=${{ env.IMAGE_NAME }}:${{ github.sha }}
          kubectl set env deployment/product-service-canary APP_VERSION=${{ github.sha }}-canary
          kubectl rollout status deployment/product-service-canary --timeout=180s

      - name: Observe canary
        if: env.KUBE_CONFIG != ''
        run: |
          echo "Watching canary for 60 seconds..."
          sleep 60
          READY=$(kubectl get deployment product-service-canary -o jsonpath='{.status.readyReplicas}')
          [ "${READY:-0}" -ge 1 ] || { echo "Canary unhealthy"; exit 1; }

      - name: Roll back canary on failure
        if: failure() && env.KUBE_CONFIG != ''
        run: kubectl scale deployment/product-service-canary --replicas=0

  # 4. Promote to 100% - waits for manual approval if the "production"
  #    environment has required reviewers (Settings > Environments)
  promote:
    needs: deploy-canary
    runs-on: ubuntu-latest
    environment: production
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - uses: actions/checkout@v4

      - name: No cluster configured
        if: env.KUBE_CONFIG == ''
        run: echo "KUBE_CONFIG secret not set - would promote ${{ github.sha }} to all users."

      - name: Promote canary image to stable
        if: env.KUBE_CONFIG != ''
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBE_CONFIG" | base64 -d > $HOME/.kube/config
          kubectl set image deployment/product-service-stable app=${{ env.IMAGE_NAME }}:${{ github.sha }}
          kubectl set env deployment/product-service-stable APP_VERSION=${{ github.sha }}
          kubectl rollout status deployment/product-service-stable --timeout=300s
          kubectl scale deployment/product-service-canary --replicas=0
