name: CI

on:
  push:
    branches-ignore: [main]     # main is tested by the CD workflow
  pull_request:
  workflow_call:                # lets cd.yml reuse this pipeline

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Runs unit tests, MockMvc tests, Testcontainers integration tests
      # (Docker is preinstalled on ubuntu-latest) and Pact consumer + provider tests.
      - name: Build and test
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports

      - name: Upload Pact contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: target/pacts
