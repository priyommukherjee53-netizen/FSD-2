spring.application.name=ci-cd-demo
server.port=8080

# Dev/default database: in-memory H2 (tests with Testcontainers use PostgreSQL instead)
spring.datasource.url=jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update

# Shown by /api/version - set APP_VERSION env var to tell stable from canary
app.version=dev

management.endpoints.web.exposure.include=health,info
