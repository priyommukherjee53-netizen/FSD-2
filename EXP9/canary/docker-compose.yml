# Local canary simulation: nginx sends ~90% of requests to "stable"
# and ~10% to "canary". No Kubernetes needed - only Docker.
services:
  stable:
    build: ..
    image: ci-cd-demo:local
    environment:
      APP_VERSION: "1.0.0-stable"

  canary:
    build: ..
    image: ci-cd-demo:local
    environment:
      APP_VERSION: "2.0.0-canary"

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - stable
      - canary
