apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
      track: canary
  template:
    metadata:
      labels:
        app: product-service
        track: canary
    spec:
      containers:
        - name: app
          image: DOCKERHUB_USER/ci-cd-demo:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "canary"
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 5
