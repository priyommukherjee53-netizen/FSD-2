apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service-stable
spec:
  replicas: 9                      # 9 stable pods + 1 canary pod = ~10% canary traffic
  selector:
    matchLabels:
      app: product-service
      track: stable
  template:
    metadata:
      labels:
        app: product-service
        track: stable
    spec:
      containers:
        - name: app
          image: DOCKERHUB_USER/ci-cd-demo:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "stable"
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 10
